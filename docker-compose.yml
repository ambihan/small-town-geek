services:
  postgres:
    image: postgres:16-alpine
    container_name: stg-postgres
    restart: unless-stopped
    environment:
      # 仅用于本地开发，请勿用于生产。
      POSTGRES_DB: small_town_geek
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d small_town_geek"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

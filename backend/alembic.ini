[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# 说明：实际数据库连接从 app.core.config.settings.database_url 读取（见 alembic/env.py），
# 此处不写死 sqlalchemy.url，避免泄露 / 覆盖环境配置。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
